name: CI

on:
  pull_request:
    branches: [main, develop]
  # Also build main directly. A squash merge can produce a main that neither
  # side's PR run ever built (see #210: #208's squash dropped a file deletion
  # and left main unbuildable for 20 hours, unnoticed).
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
